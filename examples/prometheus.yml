# Sample Prometheus configuration for Contex.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'prometheus-alerts.yml'

scrape_configs:
  - job_name: 'contex'
    static_configs:
      - targets: ['contex:8001']
    metrics_path: '/metrics'
    # /metrics answers 404 without the server's METRICS_TOKEN.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/contex-metrics-token
