<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumor Mill</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --limewash: #eef0ea;
  --plaster: #e2e6dd;
  --slate: #23302e;
  --lichen: #55654f;
  --woad: #2f5d8a;
  --weld: #f0d873;
  --rail: #b9c3b5;
  --edge: #76836f;
  --danger: #9b2c2c;
  --bg: var(--limewash);
  --panel: var(--plaster);
  --ink: var(--slate);
  --muted: var(--lichen);
  --accent: var(--woad);
  --mark: var(--weld);
  --on-accent: #ffffff;
  --face-edge: rgb(35 48 46 / .3);
  --bait: #3f7d37;
  --off: #8a5f0f;
  --wary: #a33b3b;
  --wait: #2b5d8a;
  --kept: #5a6152;
  --talk: #6a4c93;
  --rumor: "Alegreya", Georgia, "Times New Roman", serif;
  --ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a2226;
    --panel: #222c31;
    --ink: #dce3dc;
    --muted: #9aab99;
    --accent: #8fb4de;
    --mark: #6a5714;
    --rail: #3f4d50;
    --edge: #6b7a7c;
    --danger: #f19a9a;
    --on-accent: #10202f;
    --face-edge: rgb(255 255 255 / .3);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--ui);
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 20rem;
  grid-template-rows: auto minmax(0, 1fr);
  height: 100dvh;
}
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: baseline;
  gap: 1rem;
  padding: .75rem 1.25rem;
}
h1 { font: 500 1.5rem/1.2 var(--rumor); margin: 0; }
.conn { font-size: .875rem; color: var(--muted); margin-left: auto; }
.conn::before {
  content: ""; display: inline-block; width: .5rem; height: .5rem; border-radius: 50%;
  background: var(--muted); margin-right: .4rem; vertical-align: .05rem;
}
.conn[data-state="live"]::before { background: var(--accent); }
.conn[data-state="down"] { color: var(--danger); }
.conn[data-state="down"]::before { background: var(--danger); }
.drawer-toggle { display: none; }

main {
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.feed {
  flex: 1;
  overflow-y: auto;
  list-style: none;
  margin: 0;
  padding: .5rem 1.25rem 1.5rem;
}
.feed:empty { flex: 0; padding: 0; }
.empty { flex: 1; display: grid; place-content: center; color: var(--muted); text-align: center; padding: 1rem; margin: 0; }
.empty[hidden] { display: none; }
.ev { display: flex; padding: .35rem 0; max-width: 46rem; }
.ev .body { min-width: 0; }
.meta { margin: 0; font-size: .875rem; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 700; }
.said {
  margin: .1rem 0 0;
  font: 1.15rem/1.45 var(--rumor);
  max-width: 62ch;
  overflow-wrap: anywhere;
}
.rails {
  flex: none;
  align-self: stretch;
  width: calc(var(--d, 0) * 1rem);
  background: repeating-linear-gradient(to right, var(--rail) 0 2px, transparent 2px 1rem);
  background-position: .35rem 0;
}
.whisper { margin-top: .75rem; }
.whisper .said { font-style: italic; }
.hop, .whisper { cursor: pointer; border-radius: 4px; }
mark {
  background: linear-gradient(transparent 55%, var(--mark) 55%, var(--mark) 92%, transparent 92%) no-repeat;
  color: inherit;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
mark.kept {
  background: none;
  text-decoration: underline 2px var(--accent);
  text-underline-offset: .2em;
}
.diffnote { margin: .1rem 0 0; font-size: .8rem; color: var(--muted); }
.fresh mark:not(.kept) { animation: ink 900ms ease-out; }
@keyframes ink { from { background-size: 0 100%; } to { background-size: 100% 100%; } }
.note { font-size: .875rem; color: var(--muted); padding: .2rem 0; max-width: 46rem; }
.note.goal { color: var(--ink); }
.brush { font: italic 1rem/1.4 var(--rumor); color: var(--ink); }
.note.against { color: var(--ink); border-left: 2px solid var(--danger); padding-left: .6rem; margin: .25rem 0; }
.gameover {
  flex: none;
  max-height: 50%;
  overflow-y: auto;
  background: var(--panel);
  border-bottom: 1px solid var(--rail);
  padding: 1rem 1.25rem 1.1rem;
  animation: settle 400ms ease-out;
}
.gameover[hidden] { display: none; }
.gameover > div { max-width: 46rem; }
.gameover h2 { font: 500 1.5rem/1.25 var(--rumor); margin: 0 0 .5rem; width: fit-content; }
.gameover h3 { color: var(--ink); font-size: .9rem; font-weight: 700; margin: .75rem 0 .2rem; }
.gameover ul { margin: 0; padding-left: 1.25rem; font-size: .95rem; }
.gameover li { margin: .1rem 0; }
.gameover .restart { margin: .75rem 0 0; color: var(--muted); font-size: .875rem; }
@keyframes settle { from { opacity: 0; } to { opacity: 1; } }
.feed.tracing .hop:not(.lit), .feed.tracing .whisper:not(.lit), .feed.tracing .note { opacity: .35; }
.feed.tracing .vt, .feed.tracing .drift, .feed.tracing .reply { opacity: .35; }
.lit .rails { background-image: repeating-linear-gradient(to right, var(--accent) 0 2px, transparent 2px 1rem); }
.rumor {
  border: 1px solid var(--rail); border-radius: 8px; padding: .45rem .9rem .6rem; margin: .75rem 0; max-width: 46rem;
  background: var(--panel);
}
.rumor .chip { background: var(--bg); }
.rumor .chip .badge { border-color: var(--bg); }
.rumor > .whisper { margin-top: 0; }
.tally { margin: .1rem 0 .2rem; font-size: .8rem; color: var(--muted); }
.tally:empty { display: none; }
.thread, .talk, .vt-lines { list-style: none; margin: 0; padding: 0; }
.drift { padding: .2rem 0 0 .35rem; font-size: .85rem; font-style: italic; color: var(--muted); }
.talk:not(:empty) { border-top: 1px solid var(--rail); margin-top: .4rem; padding-top: .1rem; }
.talk .mine { margin-top: .2rem; }
.reply { padding: .3rem 0 .3rem 1.5rem; }
.vt {
  max-width: 46rem; margin: .5rem 0; padding: .2rem 0 .2rem .6rem;
  border-left: 2px dashed var(--rail); font-size: .875rem; color: var(--muted);
}
.vt-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 .75rem; margin: 0; }
.vt-lines li { display: flex; align-items: baseline; gap: .75rem; padding: .15rem 0; }
.vt-line { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.vt-why { font-size: .75rem; font-style: italic; }
.vt-talk { flex: none; }
.vt:not(.open) .vt-lines > li:nth-last-child(n+3) { display: none; }
.where { margin: 0; font-size: .85rem; color: var(--muted); }

.composer {
  border-top: 1px solid var(--rail);
  padding: .75rem 1.25rem 1rem;
  background: var(--bg);
}
.composer form { position: relative; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.composer label { font-size: .875rem; color: var(--muted); }
input[type="text"], input[type="search"] {
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 6px;
  padding: .5rem .65rem;
  min-width: 0;
}
#target { width: 12rem; }
#text { flex: 1 1 16rem; font-family: var(--rumor); font-size: 1.1rem; padding: .4rem .65rem; }
.primary {
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
  border-radius: 6px;
  padding: .5rem 1.1rem;
  font-weight: 700;
  cursor: pointer;
}
.primary:disabled { opacity: .6; cursor: progress; }
.over .primary:disabled { cursor: not-allowed; }
.status { margin: .4rem 0 0; min-height: 1.25rem; font-size: .875rem; color: var(--muted); }
.status.error { color: var(--danger); }

aside {
  background: var(--panel);
  overflow-y: auto;
  padding: 0 1.25rem 1.5rem;
  min-height: 0;
}
h2 { font-size: 1rem; margin: 1rem 0 .5rem; }
h3 { font-size: .875rem; color: var(--muted); font-weight: 400; margin: .9rem 0 .2rem; }
.strip {
  flex: none;
  display: flex;
  align-items: flex-start;
  gap: 1.5rem;
  padding: .25rem 1.25rem .6rem;
  border-bottom: 1px solid var(--rail);
}
.strip-toggle { display: none; }
.goals {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
  gap: .4rem 1.25rem;
  list-style: none;
  margin: 0;
  padding: 0;
}
.goals li { min-width: 0; }
.goal-text { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-side { flex: none; max-width: 15rem; text-align: right; }
.bar { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--muted); }
.bar span:first-child { flex: 1; height: 4px; background: var(--rail); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.met .bar { color: var(--accent); font-weight: 700; }
.heat { margin: 0; font: italic 1rem/1.3 var(--rumor); }
#search { width: 100%; }
.find-status { margin: .25rem 0 0; min-height: 1.25rem; font-size: .8rem; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: .5rem; margin-top: .25rem; }
.tile { background: var(--bg); border: 1px solid var(--rail); border-radius: 6px; padding: .35rem .5rem .45rem; min-width: 0; }
.tile.open { grid-column: 1 / -1; }
.place {
  display: flex; justify-content: space-between; gap: .5rem; width: 100%;
  background: none; border: 0; padding: 0; text-align: left; font-size: .875rem; font-weight: 700; cursor: pointer;
}
.place span { color: var(--muted); font-weight: 400; }
.faces { display: flex; flex-wrap: wrap; gap: 5px; margin-top: .3rem; }
.pick, .more { background: none; border: 0; padding: 0; border-radius: 5px; cursor: pointer; }
.more { font-size: .75rem; color: var(--muted); padding: 0 .2rem; }
.face { position: relative; display: inline-block; flex: none; line-height: 0; }
.face canvas {
  width: 24px; height: 24px; border-radius: 5px; image-rendering: pixelated;
  outline: 1px solid var(--face-edge); outline-offset: -1px;
}
.face.big canvas { width: 32px; height: 32px; border-radius: 6px; }
.badge {
  position: absolute; right: -5px; bottom: -5px; width: 15px; height: 15px; border-radius: 50%;
  display: inline-grid; place-items: center; font: 700 10px/1 var(--ui); color: #fff;
  border: 2px solid var(--bg); box-sizing: content-box;
}
.badge[data-s="took_the_bait"] { background: var(--bait); }
.badge[data-s="brushed_off"] { background: var(--off); }
.badge[data-s="wary"] { background: var(--wary); }
.badge[data-s="listening"] { background: var(--wait); font-size: 13px; letter-spacing: -1px; line-height: .5; }
.badge[data-s="kept"] { background: var(--kept); }
.badge[data-s="answered"] { background: var(--talk); }
.searching .pick:not(.hit) { opacity: .35; }
.pick.hit canvas { outline: 2px solid var(--accent); outline-offset: 1px; }
.rows { list-style: none; margin: .3rem 0 0; padding: 0; max-height: min(18rem, 40dvh); overflow-y: auto; }
.row {
  display: flex; gap: .6rem; align-items: flex-start; width: 100%; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--rail); padding: .4rem .25rem; cursor: pointer;
}
.row:hover, .row[aria-current="true"] { background: var(--panel); }
.who { min-width: 0; font-size: .875rem; line-height: 1.35; overflow-wrap: anywhere; }
.who small { color: var(--muted); }
.who .st { font-size: .8rem; color: var(--muted); }
.scroll-more { margin: .2rem 0 0; min-height: 1rem; font-size: .75rem; color: var(--muted); text-align: center; }
.who .hint { display: block; font: italic .95rem/1.35 var(--rumor); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: .25rem .75rem; margin: .6rem 0 0; font-size: .75rem; color: var(--muted); }
.legend .badge, .chip .badge { position: static; vertical-align: -.2rem; margin-right: .2rem; }
.chip {
  display: inline-block; margin: .3rem 0 0; padding: .1rem .6rem .1rem .3rem; border-radius: 1rem;
  background: var(--panel); font-size: .85rem; overflow-wrap: anywhere;
}
.chip .badge { border-color: var(--panel); }
.chip[data-state="checking"], .chip[data-state="not_carried"] { padding-left: .6rem; color: var(--muted); }
.card {
  position: fixed; top: var(--top, 4rem); right: calc(20rem + .75rem); z-index: 3;
  width: 19rem; max-height: calc(100dvh - 2rem); overflow-y: auto;
  background: var(--bg); border: 1px solid var(--edge); border-radius: 8px; padding: .75rem .9rem;
  box-shadow: 0 6px 24px rgb(0 0 0 / .2);
}
.card[hidden] { display: none; }
.card h3 { color: var(--ink); font-size: 1.05rem; font-weight: 700; margin: 0; }
.card p { margin: .35rem 0; font-size: .9rem; }
.card dl { margin: .35rem 0; font-size: .9rem; }
.card dt { color: var(--muted); font-size: .8rem; }
.card dd { margin: 0 0 .35rem; }
.card .rel { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.card .actions { display: flex; gap: .5rem; align-items: center; margin-top: .5rem; }
.suggest {
  position: absolute; bottom: 100%; left: 0; z-index: 3; width: min(26rem, 100%); max-height: 18rem; overflow-y: auto;
  list-style: none; margin: 0 0 .3rem; padding: .25rem; background: var(--panel);
  border: 1px solid var(--edge); border-radius: 6px; box-shadow: 0 4px 16px rgb(0 0 0 / .15);
}
.suggest[hidden] { display: none; }
.suggest li { display: flex; gap: .6rem; align-items: flex-start; padding: .3rem .4rem; border-radius: 4px; cursor: pointer; }
.suggest li:hover, .suggest li[aria-selected="true"] { background: var(--bg); }
.suggest li[aria-selected="true"] { outline: 2px solid var(--accent); outline-offset: -2px; }
.usage { margin: .1rem 0 0; font-size: .75rem; color: var(--muted); }
.usage:empty { display: none; }
.linkish { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; font-size: .875rem; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  header { padding: .6rem 1rem; align-items: center; }
  .drawer-toggle {
    display: inline-block; background: var(--panel); border: 1px solid var(--edge);
    border-radius: 6px; padding: .3rem .7rem; cursor: pointer; font-size: .875rem;
  }
  .conn { margin-left: 0; }
  header .spacer { margin-left: auto; }
  aside {
    position: fixed; inset: 3.25rem 0 0 0; z-index: 2; display: none;
    padding: .5rem 1rem 2rem;
  }
  aside.open { display: block; }
  .feed { padding: .5rem 1rem 1rem; }
  .strip { flex-wrap: wrap; align-items: center; gap: .25rem .75rem; padding: .25rem 1rem .5rem; }
  .strip-toggle {
    display: inline-block; flex: none; background: none; border: 0; padding: .2rem 0;
    cursor: pointer; font-size: .875rem; font-weight: 700;
  }
  .strip-toggle::after { content: " \25BE"; }
  .strip-toggle[aria-expanded="true"]::after { content: " \25B4"; }
  .goals { display: none; flex: 1 0 100%; order: 3; grid-template-columns: minmax(0, 1fr); }
  .strip.open .goals { display: grid; }
  .strip-side { display: contents; }
  .heat { flex: 1; min-width: 0; text-align: right; font-size: .95rem; }
  .where { order: 2; flex: 1 0 100%; text-align: right; }
  .usage { order: 4; flex: 1 0 100%; text-align: left; }
  .strip:not(.open) .usage { display: none; }
  .gameover { max-height: 45%; padding: .75rem 1rem; }
  .gameover h2 { font-size: 1.25rem; }
  .gameover ul { font-size: .875rem; }
  .composer { padding: .6rem 1rem .8rem; }
  #target { flex: 1 1 100%; width: auto; }
  #text { flex-basis: 10rem; }
  .rails { width: calc(min(var(--d, 0), 4) * .75rem); background-size: .75rem 100%; }
  .card {
    top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 60dvh;
    border-radius: 10px 10px 0 0; border-width: 1px 0 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .fresh mark, .gameover { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Rumor Mill</h1>
    <span class="spacer"></span>
    <span class="conn" id="conn" data-state="connecting" role="status">Connecting</span>
    <button class="drawer-toggle" id="drawer-toggle" aria-controls="town" aria-expanded="false">Villagers</button>
  </header>

  <main>
    <section class="strip" id="strip" aria-label="Goals and mood">
      <button class="strip-toggle" id="strip-toggle" aria-expanded="false" aria-controls="goals"></button>
      <ul class="goals" id="goals"></ul>
      <div class="strip-side">
        <p class="heat" id="heat" aria-live="polite"></p>
        <p class="where" id="where"></p>
        <p class="usage" id="usage"></p>
      </div>
    </section>
    <div class="stage">
      <section class="gameover" id="gameover" aria-labelledby="gameover-title" hidden>
        <div>
          <h2 id="gameover-title" tabindex="-1"></h2>
          <h3>Goals</h3>
          <ul id="gameover-goals"></ul>
          <div id="gameover-reasons"></div>
          <p class="restart">To play again, restart the program.</p>
        </div>
      </section>
      <ol class="feed" id="feed" role="log" aria-live="off" aria-label="What the village is saying"></ol>
      <p class="empty" id="empty">Whisper to a villager to start a rumor. Pick someone whose trade or fears fit it.</p>
    </div>
    <div class="composer">
      <form id="whisper">
        <label for="target" id="to-label">Whisper to</label>
        <input type="text" id="target" autocomplete="off" placeholder="a name or a trade" required
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        <ul class="suggest" id="suggest" role="listbox" aria-label="Villagers" hidden></ul>
        <label for="text" class="visually-hidden">What to whisper</label>
        <input type="text" id="text" maxlength="500" autocomplete="off" placeholder="the miller waters his flour" required>
        <button class="primary" type="submit">Whisper</button>
      </form>
      <p class="status" id="status" role="status"></p>
    </div>
  </main>

  <aside id="town" aria-label="Villagers">
    <h2 id="people-heading">Village</h2>
    <label for="search" class="visually-hidden">Find a villager</label>
    <input type="search" id="search" placeholder="Find by name, trade, or place" autocomplete="off">
    <p class="find-status" id="find-status" role="status"></p>
    <div class="tiles" id="people"></div>
    <p class="legend">
      <span><span class="badge" data-s="took_the_bait" aria-hidden="true">✓</span>took the bait</span>
      <span><span class="badge" data-s="answered" aria-hidden="true">↩</span>answered you</span>
      <span><span class="badge" data-s="kept" aria-hidden="true">○</span>kept it quiet</span>
      <span><span class="badge" data-s="brushed_off" aria-hidden="true">–</span>brushed you off</span>
      <span><span class="badge" data-s="wary" aria-hidden="true">!</span>wary of you</span>
      <span><span class="badge" data-s="listening" aria-hidden="true">…</span>listening</span>
    </p>
    <section class="card" id="card" role="dialog" aria-labelledby="card-title" hidden></section>
  </aside>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const feed = $("feed");
const spoken = new Map();
const goals = new Map();
const MAX_ITEMS = 1000;
// Above this share of new words, mark what survived instead of what changed.
const REWORDED = 0.6;
let villagers = [];
let villagersKey = "";
let places = [];
let boot = null;
let lastId = 0;
let pinned = null;
let selected = null;
let rover = null;
let pointing = false;
let peopleStale = false;
let over = false;
let notes = {};
let lastTarget = null;
let cardOpener = null;
const statuses = new Map();
// Rumor cards by whisper id; each whisper and reply id to its card's id; hop and line ids already on a card.
const cards = new Map();
const cardOf = new Map();
const shown = new Set();
const tallies = new Map();
// Open conversations: villager id to their name and card, newest last.
const talks = new Map();
const DRIFT = "The story turned to other things after this.";
const REASONS = { inflammatory: "heated", goal: "about your goal" };
// What the feed's arrow keys move between; the feed itself is one tab stop.
const ROVE = ".hop, .whisper, .reply, .vt-more, .vt-talk";
let talkLines = 0;
const OPEN_KEY = "rumor-mill-open-place";
const FACES_SHOWN = 11;

function el(tag, { dataset, ...props } = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  Object.assign(node.dataset, dataset);
  node.append(...children.filter((c) => c != null));
  return node;
}

function words(text) {
  return text.split(/\s+/).filter(Boolean);
}

function bare(word) {
  return word.toLowerCase().replace(/[^\p{L}\p{N}']/gu, "");
}

// Words of `text` that are not in its longest common word sequence with `parent`.
function changed(parent, text) {
  const a = words(parent).map(bare);
  const b = words(text);
  const bb = b.map(bare);
  const lcs = Array.from({ length: a.length + 1 }, () => new Array(bb.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) {
    for (let j = bb.length - 1; j >= 0; j--) {
      lcs[i][j] = a[i] === bb[j] ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    }
  }
  const kept = new Set();
  for (let i = 0, j = 0; i < a.length && j < bb.length;) {
    if (a[i] === bb[j]) { kept.add(j); i++; j++; }
    else if (lcs[i + 1][j] >= lcs[i][j + 1]) i++;
    else j++;
  }
  return b.map((w, j) => [w, !kept.has(j)]);
}

// Words too common to count as having survived a retelling.
const STOPWORDS = new Set(("about after again also because been before being could does from have here into just like more most much only other over said some such than that their them then there these they this those very were what when where which while will with would your").split(" "));
const NOTES = {
  changed: "Highlighted words changed since the last telling.",
  kept: "Mostly reworded. Underlined words survived from the last telling.",
};
const noted = new Set();

function content(word) {
  const w = bare(word);
  return w.length > 3 && !STOPWORDS.has(w);
}

// The quote, plus a note on the first hop of a thread that uses each kind of mark.
function quoted(text, parentText, root) {
  const p = el("p", { className: "said" });
  if (parentText == null) {
    p.textContent = `“${text}”`;
    return [p];
  }
  const parts = changed(parentText, text);
  const fresh = parts.filter(([, isNew]) => isNew).length;
  const mode = fresh > REWORDED * parts.length ? "kept" : "changed";
  // Neighbouring marked words become one run, so a stretch reads as one stroke.
  const runs = [];
  for (const [w, isNew] of parts) {
    const marked = mode === "kept" ? !isNew && content(w) : isNew;
    const last = runs[runs.length - 1];
    if (last && last.marked === marked) last.words.push(w);
    else runs.push({ marked, words: [w] });
  }
  p.append("“");
  runs.forEach((run, i) => {
    if (i) p.append(" ");
    const said = run.words.join(" ");
    p.append(run.marked ? el("mark", { className: mode === "kept" ? "kept" : "", textContent: said }) : said);
  });
  p.append("”");
  const key = `${root} ${mode}`;
  if (!runs.some((run) => run.marked) || noted.has(key)) return [p];
  noted.add(key);
  return [p, el("p", { className: "diffnote", textContent: NOTES[mode] })];
}

function nameList(names, heard) {
  if (heard === 1) return names[0] || "someone";
  return `${heard} people`;
}

function hopMeta(e, parent) {
  const meta = el("p", { className: "meta" }, el("b", { textContent: e.speaker }));
  const where = ` at the ${e.place}`;
  if (e.verb === "announced") meta.append(` announced${where}, heard by ${nameList(e.listeners, e.heard)}`);
  else if (e.verb === "preached") meta.append(` preached to ${nameList(e.listeners, e.heard)}${where}`);
  else if (e.heard === 1) meta.append(" told ", el("b", { textContent: e.listeners[0] || "someone" }), where);
  else meta.append(` told ${e.heard} people${where}`);
  if (parent) meta.append(`, after hearing ${parent.speaker}`);
  return meta;
}

// A whisper's card: the whisper as its title, its chip and tally, then its retellings and any conversation.
function newCard(uid, target, place, text) {
  spoken.set(uid, { text, parent: null, speaker: "you" });
  cardOf.set(uid, uid);
  const status = statuses.get(uid);
  const card = el("li", { className: "rumor", dataset: { card: uid } },
    el("div", { className: "ev whisper", tabIndex: -1, dataset: { uid } },
      el("span", { className: "rails", style: "--d:0" }),
      el("div", { className: "body" },
        el("p", { className: "meta" }, "You whispered to ", el("b", { textContent: target }), place ? ` at the ${place}` : ""),
        ...quoted(text), status && chip(status))),
    el("p", { className: "tally" }), el("ol", { className: "thread" }), el("ol", { className: "talk" }));
  cards.set(uid, card);
  setTally(uid);
  return card;
}

function setTally(uid) {
  const card = cards.get(uid);
  const t = tallies.get(uid);
  if (card) card.querySelector(".tally").textContent = t ? `heard by ${t.heard} · still told by ${t.still}` : "";
}

function setTallies(list) {
  for (const c of list) {
    tallies.set(c.uid, c);
    setTally(c.uid);
  }
}

function addTo(card, where, node, fresh) {
  if (fresh) node.classList.add("fresh");
  card.querySelector(where).append(node);
}

// The newcomer's line in a conversation, with its own chip.
function mine(uid, text) {
  spoken.set(uid, { text, parent: null, speaker: "you" });
  const status = statuses.get(uid);
  return el("li", { className: "ev whisper mine", tabIndex: -1, dataset: { uid } },
    el("span", { className: "rails", style: "--d:0" }),
    el("div", { className: "body" }, el("p", { className: "meta" }, el("b", { textContent: "You" })),
      ...quoted(text), status && chip(status)));
}

function theirs(name, text) {
  return el("li", { className: "reply", tabIndex: -1 }, el("p", { className: "meta" }, el("b", { textContent: name }), " answers you"),
    el("p", { className: "said", textContent: `“${text}”` }));
}

// A card from /api/state, for a whisper older than the replay; its hops lack the replay's detail.
// Hops and lines still in the replay are left to it.
function restoredCard(c, replayed) {
  const card = newCard(c.uid, c.target_name, null, c.text);
  for (const h of c.hops) {
    if (replayed.has(h.uid)) continue;
    shown.add(h.uid);
    spoken.set(h.uid, { text: h.text, parent: null, speaker: h.speaker });
    const told = h.listeners.length === 1 ? [" told ", el("b", { textContent: h.listeners[0] })] : [` told ${h.listeners.length} people`];
    addTo(card, ".thread", el("li", { className: "ev hop", tabIndex: -1, dataset: { uid: h.uid } },
      el("span", { className: "rails", style: "--d:1" }),
      el("div", { className: "body" }, el("p", { className: "meta" }, el("b", { textContent: h.speaker }), ...told), ...quoted(h.text))));
  }
  if (c.drifted) addTo(card, ".thread", el("li", { className: "drift", textContent: DRIFT }));
  for (const line of c.conversation) {
    if (replayed.has(line.uid)) continue;
    shown.add(line.uid);
    if (line.speaker_id === "newcomer") cardOf.set(line.uid, c.uid);
    addTo(card, ".talk", line.speaker_id === "newcomer" ? mine(line.uid, line.text) : theirs(line.speaker, line.text));
  }
  return card;
}

// Overheard lines join the village talk block at the end of the feed when it is for the same place;
// returns a new block to append, or null.
function overheard(e) {
  const last = feed.lastElementChild;
  const block = last && last.matches(".vt") && last.dataset.place === e.place ? last : talkBlock(e.place);
  const why = REASONS[e.reason];
  const id = `talk-line-${++talkLines}`;
  block.querySelector(".vt-lines").append(el("li", {},
    el("span", { className: "vt-line", id }, el("b", { textContent: e.speaker_name }),
      why ? el("span", { className: "vt-why", textContent: ` · ${why}` }) : null, ": ", e.text),
    el("button", { type: "button", className: "linkish vt-talk", tabIndex: -1, textContent: "Talk", dataset: { line: id },
      ariaLabel: `Talk to ${e.speaker_name} about this`, onclick: () => talkAbout(e.speaker_name, e.text) })));
  block.querySelector(`[data-line="${id}"]`).setAttribute("aria-describedby", id);
  countTalk(block);
  // A new line hides the oldest of the two shown; arrow focus moves to the block's toggle.
  if (rover && block.contains(rover) && !rover.getClientRects().length) {
    const had = document.activeElement === rover;
    setRover(block.querySelector(".vt-more"));
    if (had) rover.focus();
  }
  return block === last ? null : block;
}

function talkBlock(place) {
  const block = el("li", { className: "vt", dataset: { place } });
  const toggle = el("button", { type: "button", className: "linkish vt-more", tabIndex: -1, ariaExpanded: "false", onclick: () => {
    toggle.ariaExpanded = String(block.classList.toggle("open"));
    countTalk(block);
  } });
  block.append(el("p", { className: "vt-head" }, el("span"), toggle), el("ol", { className: "vt-lines" }));
  return block;
}

function countTalk(block) {
  const n = block.querySelector(".vt-lines").children.length;
  const toggle = block.querySelector(".vt-more");
  block.querySelector(".vt-head span").textContent = `Village talk at the ${block.dataset.place} · ${n} ${n === 1 ? "line" : "lines"}`;
  toggle.hidden = n <= 2;
  toggle.textContent = block.classList.contains("open") ? "Show fewer" : `Show all ${n}`;
}

function talkAbout(name, text) {
  if (over) return;
  $("target").value = name;
  $("text").value = `You said: "${text}" `;
  showSuggestions([]);
  setDrawer(false);
  $("text").focus();
  $("text").setSelectionRange($("text").value.length, $("text").value.length);
  setComposer();
}

// The composer says "Talking with" while the To box names a villager in an open conversation.
function setComposer() {
  const name = $("target").value.trim().toLowerCase();
  const on = [...talks.values()].some((t) => t.name.toLowerCase() === name);
  $("to-label").textContent = on ? "Talking with" : "Whisper to";
  $("whisper").querySelector("button").textContent = on ? "Reply" : "Whisper";
  if (!over) $("text").placeholder = on ? "Say something back" : "the miller waters his flour";
}

// Only a live answer fills the To box; a replayed one may have been closed since.
function startTalk(e, fresh) {
  if (over) return;
  talks.delete(e.villager_id);
  talks.set(e.villager_id, { name: e.name, card: cardOf.get(e.whisper_id) });
  if (fresh && !$("whisper").contains(document.activeElement)) $("target").value = e.name;
  setComposer();
}

function endTalk(villagerId) {
  if (talks.delete(villagerId)) setComposer();
}

function render(e, fresh) {
  switch (e.kind) {
    case "whisper": {
      lastTarget = e.target_id;
      if (cardOf.has(e.uid)) return null;
      const home = e.conversation && cards.get(cardOf.get(e.conversation));
      if (!home) return newCard(e.uid, e.target, e.place, e.text);
      cardOf.set(e.uid, home.dataset.card);
      addTo(home, ".talk", mine(e.uid, e.text), fresh);
      return null;
    }
    case "hop": {
      if (shown.has(e.uid)) return null;
      const parent = spoken.get(e.parent);
      spoken.set(e.uid, { text: e.text, parent: e.parent, speaker: e.speaker });
      const node = el("li", { className: "ev hop", tabIndex: -1, dataset: { uid: e.uid } },
        el("span", { className: "rails", style: `--d:${Math.min(e.depth, 8)}` }),
        el("div", { className: "body" }, hopMeta(e, parent), ...quoted(e.text, parent && parent.text, e.root)));
      const card = cards.get(cardOf.get(e.root));
      if (!card) return node;
      shown.add(e.uid);
      addTo(card, ".thread", node, fresh);
      return null;
    }
    case "drift": {
      const card = cards.get(cardOf.get(e.whisper_id));
      if (card && !card.querySelector(".drift")) addTo(card, ".thread", el("li", { className: "drift", textContent: DRIFT }), fresh);
      return null;
    }
    case "reply": {
      if (shown.has(e.uid)) return null;
      const card = cards.get(cardOf.get(e.conversation));
      if (!card) return theirs(e.name, e.text);
      shown.add(e.uid);
      addTo(card, ".talk", theirs(e.name, e.text), fresh);
      return null;
    }
    case "overheard":
      return overheard(e);
    case "place":
      $("where").textContent = `You're at the ${e.place}`;
      return null;
    case "warning":
      return el("li", { className: "note against" },
        el("b", { textContent: e.speaker }), " warned ", el("b", { textContent: e.target }), " about you.");
    case "refusal":
      learn(e);
      endTalk(e.villager_id);
      if (!e.line) return el("li", { className: "note against" }, el("b", { textContent: e.name }), " turns away from you.");
      return el("li", { className: "note against" },
        el("b", { textContent: e.name }), " turns away from you: ", el("span", { className: "brush", textContent: `“${e.line}”` }));
    case "heat":
      $("heat").textContent = e.text;
      return el("li", { className: "note", ariaHidden: "true" }, e.text);
    case "gameover":
      showGameOver(e, fresh);
      return null;
    case "whisper_status":
      learn(e);
      showStatus(e, fresh);
      return null;
    case "announcement":
      return el("li", { className: "note" }, e.text);
    case "goal":
      goals.set(e.goal_id, { text: e.text, percent: e.percent, met: e.met });
      renderGoals();
      return el("li", { className: "note goal" },
        e.met ? `Goal met: ${e.text}` : `${e.text}: now ${e.percent}%`);
    case "system":
      return el("li", { className: "note" }, e.text);
    default:
      return null;
  }
}

// What a whisper's status chip says, by state.
const SAID = {
  heard: (e) => `${e.name} heard you.`,
  took_the_bait: (e) => `Took the bait. Told ${e.told} ${e.told === 1 ? "person" : "people"}.`,
  kept: () => "Heard you, but kept it quiet.",
  warned: () => "Heard you, and warned others about you.",
  not_carried: () => "Didn't carry.",
  answered: (e) => `${e.name} answered you.`,
  moved_on: (e) => `${e.name} moved on.`,
};

function secondsLeft(until) {
  return Math.max(0, Math.ceil(until - Date.now() / 1000));
}

function waitText(until) {
  const left = secondsLeft(until);
  return left ? `Hears you in about ${left}s.` : "Hearing you now.";
}

function chip(e) {
  const node = el("p", { className: "chip", dataset: { state: e.state } });
  const tone = STATUS_OF[e.state];
  if (e.state !== "checking" && BADGES[tone]) node.append(badge(tone));
  if (e.state === "checking") {
    node.append(el("span", { ariaHidden: "true", textContent: "…" }), el("span", { className: "visually-hidden", textContent: "Checking." }));
  } else if (e.state === "busy") {
    // The countdown ticks out of the screen reader's hearing; it hears the wait once.
    node.append(`${e.name} is busy. `,
      el("span", { ariaHidden: "true", dataset: { until: e.until }, textContent: waitText(e.until) }),
      el("span", { className: "visually-hidden wait", textContent: waitText(e.until) }));
  } else if (e.state === "brushed_off") {
    if (e.hint) node.append("Brushed you off: ", el("span", { className: "brush", textContent: `“${e.hint}”` }));
    else node.append("Brushed you off.");
  } else if (SAID[e.state]) {
    node.append(SAID[e.state](e));
  }
  return node;
}

function showStatus(e, fresh) {
  statuses.set(e.whisper_id, e);
  if (e.state === "answered") startTalk(e, fresh);
  else if (e.state === "moved_on" || e.state === "brushed_off") endTalk(e.villager_id);
  const item = feed.querySelector(`.whisper[data-uid="${CSS.escape(e.whisper_id)}"]`);
  if (!item) return;
  const old = item.querySelector(".chip");
  if (old) old.replaceWith(chip(e));
  else item.querySelector(".body").append(chip(e));
}

setInterval(() => {
  for (const node of feed.querySelectorAll("[data-until]")) {
    const until = Number(node.dataset.until);
    node.textContent = waitText(until);
    if (secondsLeft(until)) continue;
    delete node.dataset.until;
    node.parentNode.querySelector(".wait").textContent = waitText(until);
  }
}, 1000);

// The player's notes, kept by the same rule as the server's: a note only moves up, except that wary overrides anything.
const RANK = ["none", "listening", "brushed_off", "answered", "kept", "wary", "took_the_bait"];
const STATUS_OF = {
  checking: "listening", busy: "listening", heard: "listening", brushed_off: "brushed_off",
  answered: "answered", kept: "kept", moved_on: "kept", took_the_bait: "took_the_bait", warned: "wary",
};
const BADGES = {
  took_the_bait: ["✓", "took the bait"],
  answered: ["↩", "answered you"],
  kept: ["○", "kept it quiet"],
  brushed_off: ["–", "brushed you off"],
  wary: ["!", "wary of you"],
  listening: ["…", "listening"],
};
let learned = false;

function noteOf(id) {
  return notes[id] || { status: "none", hint: null };
}

function learn(e) {
  const status = e.kind === "refusal" ? "wary" : STATUS_OF[e.state];
  if (!status) return;
  const note = notes[e.villager_id] = { ...noteOf(e.villager_id) };
  if (status === "wary" || RANK.indexOf(status) > RANK.indexOf(note.status)) note.status = status;
  if (e.hint) note.hint = e.hint;
  learned = true;
}

function badge(status) {
  return el("span", { className: "badge", ariaHidden: "true", textContent: BADGES[status][0], dataset: { s: status } });
}

// Pixel faces: a 12x12 head and shoulders drawn from the villager's id, with clothes by trade.
const SKIN = ["#f1d3b3", "#e2b48f", "#c98f63", "#9c6644", "#6e4630", "#f3dcc8"];
const HAIR = ["#2b2118", "#5a3a22", "#8a5a2b", "#b88a4a", "#d9c7a3", "#9a9a9a", "#6b2f1f"];
const TINT = ["#dfe6d6", "#e6dfd2", "#d9e0e8", "#e8dcdc", "#dde4df"];
const CLOTHES = [
  [/priest|brother|chapel|friar|nun/i, "#4a4a5e"], [/smith|forge/i, "#5b4a3f"], [/mill/i, "#c9b98f"],
  [/wine|vintner|merchant/i, "#7a2f3b"], [/dye/i, "#3d5f8a"], [/mayor|reeve|steward|bailiff/i, "#2f5d4a"],
  [/thatch|carpent|joiner/i, "#8a6a3a"], [/herb|heal|apothec|midwife/i, "#5e7a3e"],
];
const PLAIN = ["#6b5b4a", "#4f6a5a", "#7a6250", "#5a5f7a"];
const faces = new Map();

function seeded(seed) {
  let h = 2166136261;
  for (const ch of seed) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
}

function drawFace(id, trade) {
  const canvas = el("canvas", { width: 12, height: 12 });
  const g = canvas.getContext("2d");
  const r = seeded(id);
  const pick = (list) => list[Math.floor(r() * list.length)];
  const px = (i, j, color) => { g.fillStyle = color; g.fillRect(i, j, 1, 1); };
  const rect = (i0, i1, j0, j1, color) => { for (let i = i0; i < i1; i++) for (let j = j0; j < j1; j++) px(i, j, color); };
  g.fillStyle = pick(TINT);
  g.fillRect(0, 0, 12, 12);
  const skin = pick(SKIN), hair = pick(HAIR);
  const clothes = (CLOTHES.find(([re]) => re.test(trade)) || [])[1] || pick(PLAIN);
  rect(2, 10, 9, 12, clothes);
  rect(1, 11, 11, 12, clothes);
  rect(4, 8, 8, 9, skin);
  rect(3, 9, 3, 8, skin);
  const style = Math.floor(r() * 4);
  rect(3, 9, 2, 3, hair);
  rect(2, 10, 3, 4, hair);
  if (style >= 1) { px(2, 4, hair); px(9, 4, hair); }
  if (style >= 2) { rect(2, 3, 5, 7, hair); rect(9, 10, 5, 7, hair); }
  if (style === 3) rect(4, 8, 1, 2, hair);
  px(4, 5, "#2a2a2a");
  px(7, 5, "#2a2a2a");
  if (r() < 0.35) { rect(4, 8, 7, 8, hair); px(3, 6, hair); px(8, 6, hair); }
  else { px(5, 7, "#a5584a"); px(6, 7, "#a5584a"); }
  if (/priest|brother|chapel|friar|nun/i.test(trade)) rect(3, 9, 2, 3, clothes);
  if (/smith/i.test(trade)) { px(3, 10, "#3a3a3a"); px(8, 10, "#3a3a3a"); }
  return canvas;
}

// A copy of the villager's face; each is drawn once and then copied.
function faceFor(id, occupation) {
  if (!faces.has(id)) faces.set(id, drawFace(id, occupation));
  const canvas = el("canvas", { width: 12, height: 12, ariaHidden: "true" });
  canvas.getContext("2d").drawImage(faces.get(id), 0, 0);
  return canvas;
}

function faceWith(v, big = false) {
  const status = noteOf(v.id).status;
  return el("span", { className: big ? "face big" : "face", ariaHidden: "true" }, faceFor(v.id, v.occupation), BADGES[status] && badge(status));
}

// The villager's name and, when the player knows something, the status in words.
function knownAs(v) {
  const b = BADGES[noteOf(v.id).status];
  return b ? `${v.name}, ${b[1]}` : v.name;
}

const OUTCOMES = { won: "Every goal is met. You won.", lost: "The village ran you out of town." };

// The end of the game: a panel above the feed, and no more whispers.
function showGameOver(summary, live) {
  const panel = $("gameover");
  const wasHidden = panel.hidden;
  const stick = nearBottom();
  $("gameover-title").textContent = OUTCOMES[summary.outcome] || "The game is over.";
  $("gameover-goals").replaceChildren(...summary.goals.map(([text, percent]) => el("li", { textContent: `${text}: ${percent}%` })));
  $("gameover-reasons").replaceChildren(...(summary.reasons.length
    ? [el("h3", { textContent: "What gave you away" }), el("ul", {}, ...summary.reasons.map((r) => el("li", { textContent: r })))]
    : []));
  panel.hidden = false;
  if (stick) feed.scrollTop = feed.scrollHeight;
  over = true;
  $("whisper").classList.add("over");
  for (const node of $("whisper").elements) node.disabled = true;
  $("text").value = "";
  $("text").placeholder = "The game is over.";
  for (const t of talks.values()) {
    const card = cards.get(t.card);
    if (card) card.querySelector(".talk").append(el("li", { className: "drift", textContent: "The conversation ended with the game." }));
  }
  talks.clear();
  setComposer();
  setStatus("The game is over.");
  if (live && wasHidden) $("gameover-title").focus({ preventScroll: true });
}

function nearBottom() {
  return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
}

function threadItems() {
  return [...feed.querySelectorAll(ROVE)].filter((n) => n.getClientRects().length);
}

// Roving focus: the feed is one tab stop, and arrow keys move between hops.
function setRover(node) {
  if (rover) rover.tabIndex = -1;
  rover = node;
  if (rover) rover.tabIndex = 0;
}

// ponytail: the cap counts top-level items, so one card or talk block can grow without limit within a game,
// and shown, tallies and statuses are never pruned; split long cards and prune the maps if a game outgrows that.
function prune() {
  while (feed.children.length > MAX_ITEMS) {
    const node = feed.firstElementChild;
    for (const n of node.querySelectorAll("[data-uid]")) spoken.delete(n.dataset.uid);
    if (node.matches(".hop")) spoken.delete(node.dataset.uid);
    if (node.dataset.card) {
      cards.delete(node.dataset.card);
      for (const [uid, card] of cardOf) if (card === node.dataset.card) cardOf.delete(uid);
    }
    if (node.contains(rover)) rover = null;
    node.remove();
  }
}

function addEvents(events, fresh) {
  const stick = feed.children.length === 0 || nearBottom();
  for (const e of events) {
    if (e.id <= lastId) continue;
    lastId = e.id;
    const node = render(e, fresh);
    if (!node) continue;
    if (fresh) node.classList.add("fresh");
    feed.append(node);
  }
  prune();
  if (learned) {
    learned = false;
    refreshVillagers();
  }
  if (!rover) setRover(threadItems()[0] || null);
  $("empty").hidden = feed.children.length > 0;
  if (stick) feed.scrollTop = feed.scrollHeight;
}

// Thread tracing: light a hop and every hop back to your whisper.
function trace(uid) {
  feed.querySelectorAll(".lit").forEach((n) => n.classList.remove("lit"));
  feed.classList.toggle("tracing", uid != null);
  for (let id = uid; id != null; id = spoken.get(id) && spoken.get(id).parent) {
    const node = feed.querySelector(`[data-uid="${CSS.escape(id)}"]:not(.note)`);
    if (node) node.classList.add("lit");
  }
}
function threadItem(target) {
  return target.closest(".hop, .whisper");
}
feed.addEventListener("mouseover", (ev) => {
  const item = threadItem(ev.target);
  if (pinned == null) trace(item ? item.dataset.uid : null);
});
feed.addEventListener("mouseleave", () => { if (pinned == null) trace(null); });
function togglePin(item) {
  pinned = item && pinned !== item.dataset.uid ? item.dataset.uid : null;
  trace(pinned);
}
feed.addEventListener("click", (ev) => {
  const item = ev.target.closest(ROVE);
  if (item) setRover(item);
  if (!ev.target.closest("button")) togglePin(threadItem(ev.target));
});
feed.addEventListener("keydown", (ev) => {
  const item = ev.target.closest(ROVE);
  if (!item) return;
  const items = threadItems();
  const at = items.indexOf(item);
  const next = { ArrowDown: at + 1, ArrowUp: at - 1, Home: 0, End: items.length - 1 }[ev.key];
  if (ev.key === "Enter" || ev.key === " ") {
    if (item.matches("button")) return;
    ev.preventDefault();
    if (item.matches(".hop, .whisper")) togglePin(item);
  } else if (next != null && items[next]) {
    ev.preventDefault();
    setRover(items[next]);
    items[next].focus();
    if (pinned != null && items[next].matches(".hop, .whisper")) togglePin(items[next]);
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key !== "Escape" || ev.defaultPrevented) return;
  if (!$("card").hidden) closeCard();
  else if (pinned != null) { pinned = null; trace(null); }
});

function renderGoals() {
  const list = $("goals");
  const all = [...goals.values()];
  $("strip-toggle").textContent = `Goals: ${all.map((g) => (g.met ? "met" : `${g.percent}%`)).join(" · ")}`;
  list.replaceChildren(...all.map((g) => el("li", { className: g.met ? "met" : "" },
    el("div", { className: "goal-text", textContent: g.text, title: g.text }),
    el("div", { className: "bar" },
      el("span", { role: "progressbar", ariaLabel: g.text, ariaValueNow: g.percent, ariaValueMin: 0, ariaValueMax: 100 },
        el("i", { style: `width:${g.percent}%` })),
      el("span", { textContent: g.met ? "Met" : `${g.percent}%` })))));
}

function capital(word) {
  return `${word[0].toUpperCase()}${word.slice(1)}`;
}

// Villagers matching a search, best first: name, then trade, then place; ties keep name order.
function matches(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const scored = [];
  for (const v of villagers) {
    const name = v.name.toLowerCase();
    const score = name.startsWith(q) || name.includes(` ${q}`) ? 4
      : name.includes(q) ? 3 : v.occupation.toLowerCase().includes(q) ? 2 : v.place.includes(q) ? 1 : 0;
    if (score) scored.push([score, v]);
  }
  return scored.sort((x, y) => y[0] - x[0]).map(([, v]) => v);
}

function storedPlace() {
  try { return localStorage.getItem(OPEN_KEY); } catch { return null; }
}

function choosePlace(place) {
  try { localStorage.setItem(OPEN_KEY, place); } catch { /* the choice lasts until reload */ }
  chosenPlace = place;
  searchPlace = null;
  renderVillagers();
}

// The open tile: the place a search opened, else the player's choice, else where they last whispered, else the square.
function openPlace(order) {
  const last = villagers.find((v) => v.id === lastTarget);
  const want = searchPlace || chosenPlace || (last && last.place) || "square";
  return order.includes(want) ? want : order[0];
}
let chosenPlace = storedPlace();
let searchPlace = null;

function faceButton(v, hits) {
  return el("button", {
    type: "button", tabIndex: -1, className: hits.has(v.id) ? "pick hit" : "pick", title: `${v.name}, ${v.occupation}`,
    dataset: { id: v.id }, onclick: (ev) => inspect(v.id, ev.currentTarget),
  }, faceWith(v), el("span", { className: "visually-hidden", textContent: knownAs(v) }));
}

function closedTile(place, here, hits) {
  const first = hits.size ? [...here.filter((v) => hits.has(v.id)), ...here.filter((v) => !hits.has(v.id))] : here;
  const shown = first.slice(0, FACES_SHOWN);
  const more = here.length - shown.length;
  return el("div", { className: "faces" }, ...shown.map((v) => faceButton(v, hits)),
    more > 0 ? el("button", { type: "button", tabIndex: -1, className: "more", textContent: `+${more}`, onclick: () => choosePlace(place) }) : null);
}

function openTile(here, hits) {
  const list = hits.size ? here.filter((v) => hits.has(v.id)) : here;
  if (!list.length) return el("p", { className: "meta", textContent: hits.size ? "No one here matches." : "No one is here." });
  const rows = el("ul", { className: "rows" }, ...list.map((v) => el("li", {}, el("button", {
    type: "button", className: "row", dataset: { id: v.id }, ariaCurrent: String(v.id === selected),
    onclick: (ev) => inspect(v.id, ev.currentTarget),
  }, faceWith(v, true), who(v, v.occupation)))));
  const more = el("p", { className: "scroll-more", ariaHidden: "true" });
  // Says how many rows are below the fold, so the list never looks cut off.
  const cue = () => {
    const rowHeight = rows.firstElementChild.offsetHeight || 1;
    const below = Math.round((rows.scrollHeight - rows.scrollTop - rows.clientHeight) / rowHeight);
    more.textContent = below > 0 ? `+${below} more, scroll` : "";
  };
  rows.addEventListener("scroll", cue);
  requestAnimationFrame(cue);
  return el("div", {}, rows, more);
}

// Name, then the status as its own words, then trade or place and the hint.
function who(v, detail) {
  const note = noteOf(v.id);
  const known = BADGES[note.status];
  return el("span", { className: "who" },
    el("b", { textContent: v.name }), known ? el("span", { className: "st", textContent: `, ${known[1]}` }) : null,
    " ", el("small", { textContent: detail }),
    note.hint ? el("span", { className: "hint", textContent: `“${note.hint}”` }) : null);
}

function focusKey(node) {
  if (node.dataset.id) return `[data-id="${CSS.escape(node.dataset.id)}"]`;
  if (node.dataset.place) return `[data-place="${CSS.escape(node.dataset.place)}"]`;
  return null;
}

function renderVillagers() {
  const people = $("people");
  const key = people.contains(document.activeElement) ? focusKey(document.activeElement) : null;
  const query = $("search").value;
  const found = matches(query);
  const hits = new Set(found.map((v) => v.id));
  const order = [...places, ...[...new Set(villagers.map((v) => v.place))].filter((p) => !places.includes(p)).sort()];
  const open = openPlace(order);
  $("people-heading").textContent = `Village (${villagers.length})`;
  people.classList.toggle("searching", hits.size > 0);
  people.replaceChildren(...order.map((place) => {
    const here = villagers.filter((v) => v.place === place);
    const count = hits.size ? `${here.filter((v) => hits.has(v.id)).length} of ${here.length}` : String(here.length);
    return el("section", { className: place === open ? "tile open" : "tile" },
      el("button", {
        type: "button", className: "place", dataset: { place }, ariaExpanded: String(place === open),
        ariaLabel: hits.size ? `${capital(place)}, ${count} villagers match` : `${capital(place)}, ${count} villagers`,
        onclick: () => choosePlace(place),
      },
        capital(place), el("span", { textContent: count })),
      place === open ? openTile(here, hits) : closedTile(place, here, hits));
  }));
  const said = !query.trim() ? ""
    : found.length ? `${found.length} found. Best match: ${found[0].name}, at the ${found[0].place}.`
    : "No one matches. Try part of a name or a trade.";
  if ($("find-status").textContent !== said) $("find-status").textContent = said;
  const again = key && people.querySelector(key);
  if (again) again.focus();
}

// Moves and notes arrive every second; hold them while someone is pointing at or tabbing through the tiles.
function refreshVillagers() {
  if (pointing || $("people").contains(document.activeElement)) peopleStale = true;
  else renderVillagers();
}
function setVillagers(list) {
  const key = list.map((v) => `${v.id}:${v.place}`).join("|");
  if (key === villagersKey) return;
  villagers = list;
  villagersKey = key;
  refreshVillagers();
}
function flushVillagers() {
  if (peopleStale && !pointing && !$("people").contains(document.activeElement)) {
    peopleStale = false;
    renderVillagers();
  }
}
$("people").addEventListener("pointerenter", () => { pointing = true; });
$("people").addEventListener("pointerleave", () => { pointing = false; setTimeout(flushVillagers); });
$("people").addEventListener("focusout", () => setTimeout(flushVillagers));
$("search").addEventListener("input", () => {
  const best = matches($("search").value)[0];
  searchPlace = best ? best.place : null;
  renderVillagers();
});
$("search").addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && $("search").value) {
    ev.preventDefault();
    $("search").value = "";
    searchPlace = null;
    renderVillagers();
  } else if (ev.key === "Enter") {
    const best = $("people").querySelector(".open .row");
    if (best) best.focus();
  }
});

// The villager card: a popover beside the tiles, or a sheet inside the drawer on a phone.
let cardRequest = 0;
async function inspect(id, opener) {
  const request = ++cardRequest;
  if (opener) cardOpener = { id: opener.dataset.id, node: opener, top: opener.getBoundingClientRect().top };
  selected = id;
  $("people").querySelectorAll(".row").forEach((row) => { row.ariaCurrent = String(row.dataset.id === id); });
  const card = $("card");
  const res = await fetch(`/api/villagers/${encodeURIComponent(id)}`).catch(() => null);
  const body = res ? await res.json().catch(() => ({})) : {};
  if (request !== cardRequest) return;
  if (!res || !res.ok) {
    card.replaceChildren(el("h3", { id: "card-title", tabIndex: -1, textContent: "Not here" }),
      el("p", { textContent: body.error || "Couldn't load that villager. Try again." }),
      el("div", { className: "actions" }, el("button", { className: "linkish", type: "button", textContent: "Close", onclick: closeCard })));
  } else {
    card.replaceChildren(...cardBody(body));
  }
  card.hidden = false;
  const top = cardOpener ? cardOpener.top - 8 : 8;
  card.style.setProperty("--top", `${Math.max(8, Math.min(top, innerHeight - card.offsetHeight - 8))}px`);
  $("card-title").focus({ preventScroll: true });
}

function cardBody(body) {
  const rels = body.relationships.length
    ? body.relationships.flatMap((r, i) => [i ? ", " : "", el("button", { className: "rel", type: "button", textContent: r.name, onclick: () => inspect(r.id) }), ` (${r.kind})`])
    : ["none"];
  const note = notes[body.id] || body.note;
  const known = BADGES[note.status];
  return [
    el("h3", { id: "card-title", tabIndex: -1, textContent: body.name }),
    el("p", { className: "meta", textContent: `${body.occupation}, at the ${body.place}` }),
    el("dl", {},
      el("dt", { textContent: "Personality" }), el("dd", { textContent: body.personality }),
      el("dt", { textContent: "Grudge" }), el("dd", { textContent: body.grudge }),
      el("dt", { textContent: "Relationships" }), el("dd", {}, ...rels),
      el("dt", { textContent: "What you know" }), el("dd", {},
        known ? known[1] : "Nothing yet.",
        note.hint ? el("span", { className: "brush", textContent: ` “${note.hint}”` }) : null)),
    el("div", { className: "actions" },
      el("button", { className: "primary", type: "button", textContent: `Whisper to ${body.name}`, onclick: () => whisperTo(body.name) }),
      el("button", { className: "linkish", type: "button", textContent: "Close", onclick: closeCard })),
  ];
}

function closeCard() {
  const opener = cardOpener;
  const inside = $("card").contains(document.activeElement);
  cardRequest++;
  $("card").hidden = true;
  selected = null;
  cardOpener = null;
  $("people").querySelectorAll(".row[aria-current='true']").forEach((row) => { row.ariaCurrent = "false"; });
  if (!opener || !inside) return;
  const node = opener.node.isConnected ? opener.node : $("people").querySelector(`[data-id="${CSS.escape(opener.id)}"]`);
  if (node) node.focus();
}

function whisperTo(name) {
  cardRequest++;
  $("card").hidden = true;
  selected = null;
  cardOpener = null;
  $("target").value = name;
  setDrawer(false);
  $("text").focus();
  setComposer();
}

// The To box typeahead: the same matches as the search, with face, trade, place, and what you know.
let suggestions = [];
let active = -1;

function setActive(i) {
  active = i;
  [...$("suggest").children].forEach((li, j) => { li.ariaSelected = String(j === i); });
  const li = $("suggest").children[i];
  if (li) {
    $("target").setAttribute("aria-activedescendant", li.id);
    li.scrollIntoView({ block: "nearest" });
  } else {
    $("target").removeAttribute("aria-activedescendant");
  }
}

function showSuggestions(list) {
  suggestions = list;
  $("suggest").replaceChildren(...list.map((v, i) => {
    return el("li", { id: `suggest-${i}`, role: "option", ariaSelected: "false", onmousedown: (ev) => { ev.preventDefault(); pickTarget(v); } },
      faceWith(v), who(v, `${v.occupation}, at the ${v.place}`));
  }));
  $("suggest").hidden = !list.length;
  $("target").ariaExpanded = String(list.length > 0);
  setActive(-1);
}

function pickTarget(v) {
  $("target").value = v.name;
  showSuggestions([]);
  $("text").focus();
  setComposer();
}

$("target").addEventListener("input", () => {
  setComposer();
  const found = matches($("target").value);
  const exact = found.length === 1 && found[0].name.toLowerCase() === $("target").value.trim().toLowerCase();
  showSuggestions(exact ? [] : found.slice(0, 8));
});
$("target").addEventListener("keydown", (ev) => {
  const open = suggestions.length > 0;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    if (!open) return showSuggestions(matches($("target").value).slice(0, 8));
    ev.preventDefault();
    const n = suggestions.length;
    const step = ev.key === "ArrowDown" ? 1 : -1;
    setActive(active < 0 ? (step > 0 ? 0 : n - 1) : (active + step + n) % n);
  } else if (ev.key === "Enter" && open && active >= 0) {
    ev.preventDefault();
    pickTarget(suggestions[active]);
  } else if (ev.key === "Escape" && open) {
    ev.preventDefault();
    showSuggestions([]);
  }
});
$("target").addEventListener("blur", () => showSuggestions([]));

function setStatus(text, error = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", error);
}

$("whisper").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = $("target").value.trim();
  const text = $("text").value.trim();
  if (!name || !text) return setStatus("Pick a villager and write what to whisper.", true);
  const match = villagers.find((v) => v.name.toLowerCase() === name.toLowerCase());
  const button = ev.submitter || $("whisper").querySelector("button");
  const reply = [...talks.values()].some((t) => t.name.toLowerCase() === name.toLowerCase());
  button.disabled = true;
  setStatus("Whispering…");
  try {
    const res = await fetch("/api/whisper", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(match ? { villager_id: match.id, text } : { name, text }),
    });
    const body = await res.json().catch(() => ({}));
    if (res.ok) {
      $("text").value = "";
      const who = match ? match.name : name;
      setStatus(reply ? `Said to ${who}.` : `Whispered to ${who}. If it touches what they care about, they'll pass it on.`);
    } else {
      setStatus(body.error || "The whisper didn't go through. Try again.", true);
    }
  } catch {
    setStatus("Can't reach the game. Check that it is still running, then try again.", true);
  } finally {
    button.disabled = over;
  }
});

function setDrawer(open) {
  $("town").classList.toggle("open", open);
  $("drawer-toggle").setAttribute("aria-expanded", String(open));
  $("drawer-toggle").textContent = open ? "Back to the feed" : "Villagers";
}
$("drawer-toggle").addEventListener("click", () => setDrawer(!$("town").classList.contains("open")));

$("strip-toggle").addEventListener("click", () => {
  const open = $("strip").classList.toggle("open");
  $("strip-toggle").setAttribute("aria-expanded", String(open));
});

function setConn(state, text) {
  $("conn").dataset.state = state;
  $("conn").textContent = text;
}

// A new boot means the game restarted and numbers its events from 1 again.
function reset() {
  feed.replaceChildren();
  closeCard();
  spoken.clear();
  goals.clear();
  noted.clear();
  statuses.clear();
  faces.clear();
  cards.clear();
  cardOf.clear();
  shown.clear();
  tallies.clear();
  talks.clear();
  setComposer();
  $("where").textContent = "";
  lastTarget = null;
  lastId = 0;
  pinned = null;
  rover = null;
  feed.classList.remove("tracing");
  over = false;
  $("gameover").hidden = true;
  $("whisper").classList.remove("over");
  for (const node of $("whisper").elements) node.disabled = false;
  $("text").placeholder = "the miller waters his flour";
  setStatus("");
}

async function loadState() {
  const res = await fetch("/api/state");
  if (!res.ok) throw new Error(String(res.status));
  const state = await res.json();
  if (boot !== null && state.boot !== boot) reset();
  boot = state.boot;
  places = state.places;
  for (const g of state.goals) goals.set(g.id, { text: g.text, percent: g.percent, met: g.met });
  renderGoals();
  notes = state.notes;
  $("usage").textContent = state.usage.summary;
  if (state.game.summary) showGameOver(state.game.summary, false);
  $("where").textContent = `You're at the ${state.place}`;
  setTallies(state.rumors);
  // The replay goes in before the log is live, so a reload doesn't read it all out.
  feed.setAttribute("aria-live", "off");
  // Cards older than the replay come back from the card state, ahead of it.
  const stick = feed.children.length === 0 || nearBottom();
  const replayed = new Set(state.events.map((e) => e.uid).filter(Boolean));
  for (const c of state.rumors) if (!cards.has(c.uid) && !replayed.has(c.uid)) feed.append(restoredCard(c, replayed));
  addEvents(state.events, false);
  const open = [...talks.values()].pop();
  if (open && !$("target").value.trim()) $("target").value = open.name;
  setComposer();
  // The game-over line on conversations whose last word was the villager's, when the replay no longer holds it.
  if (over) {
    for (const card of cards.values()) {
      const last = card.querySelector(".talk").lastElementChild;
      if (last && last.matches(".reply")) card.querySelector(".talk").append(el("li", { className: "drift", textContent: "The conversation ended with the game." }));
    }
  }
  if (stick) feed.scrollTop = feed.scrollHeight;
  setTimeout(() => feed.setAttribute("aria-live", "polite"));
  villagersKey = "";
  setVillagers(state.villagers);
  $("heat").textContent = state.heat_line;
}

function receive(e) {
  if (e.kind === "villagers") {
    setVillagers(e.villagers);
  } else if (e.kind === "rumors") {
    setTallies(e.rumors);
  } else if (e.kind === "usage") {
    $("usage").textContent = e.usage.summary;
  } else {
    addEvents([e], true);
  }
}

// Open the socket first and hold its messages until the state has loaded, so nothing falls in between.
let retry = 1000;
function connect() {
  setConn("connecting", "Connecting");
  const socket = new WebSocket(`ws://${location.host}/ws`);
  let held = [];
  socket.onmessage = (msg) => {
    const e = JSON.parse(msg.data);
    if (held) held.push(e); else receive(e);
  };
  socket.onopen = async () => {
    try {
      await loadState();
    } catch {
      socket.close();
      return;
    }
    held.forEach(receive);
    held = null;
    retry = 1000;
    setConn("live", "Live");
  };
  socket.onclose = () => {
    setConn("down", "Can't reach the game; retrying");
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 8000);
  };
}
connect();
</script>
</body>
</html>
