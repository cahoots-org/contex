          - generic [ref=e199]:
            - 'heading "Decision Matrix: Persistence, Coordination, Self-Host, Latency, Compliance" [level=2] [ref=e200]'
            - generic [ref=e201]:
              - paragraph [ref=e202]: Pricing and stars are the wrong first filter. The first filter is your persistence model and your compliance posture, because those constrain the choice hardest.
              - paragraph [ref=e203]: "A few patterns hold across the matrix:"
              - listitem [ref=e204]:
                - strong [ref=e205]: "\"Most GitHub stars\" is not a selection criterion."
                - text: Mem0 leads on stars and is genuinely the right default for personalization, but it loses by 15 points on the exact task a state-tracking agent needs. Stars measure adoption, not fit.
              - listitem [ref=e206]:
                - strong [ref=e207]: Compliance is a hard gate, not a tiebreaker.
                - text: If you are in healthcare or finance, Cognee's missing certs remove it from the list before you compare features, and you bias toward either a managed offering that carries the certs or a self-hosted deployment you can audit yourself. The same access-control discipline applies to whatever memory store you land on.
              - listitem [ref=e208]:
                - strong [ref=e209]: Latency follows architecture.
                - text: Vector lookups are cheap; graph traversals are not. If you have a tight per-turn latency budget, Zep and Cognee cost more per retrieval, and you should benchmark the worst-case traversal, not the average.
              - listitem [ref=e210]:
                - strong [ref=e211]: Multi-agent coordination favors shared graphs.
                - text: If several agents need a common memory (a team of agents working the same account), Zep's shared graph and Cognee's shared store coordinate more naturally than per-agent scoping.
              - paragraph [ref=e212]: The mistake we see most often is picking by familiarity ("we already use a vector DB, so Mem0") instead of by memory pattern. A vector DB you already run does not make Mem0 the right answer if your agent's whole job is reasoning about facts that change. Map your agent's memory pattern first (stable personalization, changing state, self-managed working set, or typed document graph), and three of the four candidates usually fall away immediately.
