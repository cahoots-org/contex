          - generic [ref=e150]:
            - 'heading "Cognee: The ECL Pipeline and Typed Knowledge Graphs" [level=2] [ref=e151]'
            - generic [ref=e152]:
              - paragraph [ref=e153]: "Cognee approaches memory from the data-engineering side. Its pipeline is ECL (Extract, Cognify, Load): extract entities and relationships from heterogeneous sources, cognify them into a structured graph with typed nodes and edges, and load the result into a queryable store. The output is a typed knowledge graph, which is more rigorous than a loose pile of memories. If you need the agent to reason over structured entities (people, organizations, documents, and the typed relationships between them), Cognee gives you that structure rather than asking you to infer it from embeddings."
              - paragraph [ref=e154]: "That rigor is genuinely valuable for knowledge-heavy agents: research assistants, agents that ingest large document corpora, anything where the relationships between entities matter as much as the entities themselves. The ECL framing also makes the pipeline inspectable; you can see what was extracted and how it was typed, which is harder with a black-box automatic-extraction store."
              - paragraph [ref=e155]: "The blocker for many teams is compliance. As of mid-2026, Cognee does not advertise SOC 2 or HIPAA certification. For internal tooling, research prototypes, and unregulated data that is a non-issue. For healthcare, finance, or any enterprise procurement that gates on certifications, the absence is disqualifying regardless of how good the graph is, and that is worth knowing before you invest engineering time. The honest positioning: Cognee is the most interesting of the four for typed-graph use cases and the least ready for regulated production."
              - paragraph [ref=e156]:
                - strong [ref=e157]: "Pick Cognee when:"
                - text: you need a typed knowledge graph from heterogeneous documents, you value pipeline inspectability, and your data is not subject to compliance gates Cognee cannot currently satisfy.
          - generic [ref=e159]:
            - 'heading "Benchmark Gaps: Where the 15 Points Come From" [level=2] [ref=e160]'
            - generic [ref=e161]:
              - paragraph [ref=e162]: Benchmarks in this category are noisy and you should treat any single number with suspicion, but the pattern across LongMemEval is consistent enough to act on. The headline gap (Zep 63.8% vs Mem0 49.0% on GPT-4o) is not a small-sample fluke; it is the predictable consequence of a temporal graph versus a flat-ish store on a benchmark designed to test temporal correctness.
              - paragraph [ref=e163]: "Two cautions about reading benchmarks here. First, LongMemEval rewards temporal correctness specifically; if your agent's memory is mostly stable facts, the 15-point gap is largely irrelevant to you, because you are not exercising the capability the benchmark measures. A framework can lose on LongMemEval and still be the right call for personalization. Second, benchmark numbers shift with the underlying model, the configuration, and the version of the framework. The 63.8% / 49.0% figures are GPT-4o results; swap the model and the absolute numbers move, even if the ordering usually holds. The defensible takeaway is directional: temporal-graph approaches beat flat-store approaches on temporal-retrieval tasks by a wide margin, and you should match the architecture to whether your facts change over time."
              - paragraph [ref=e164]:
                - text: The deeper point is that you should run the benchmark that matches
                - emphasis [ref=e165]: your
                - text: memory pattern, not borrow ours. Build a small eval set from real session traces (with contradictions, time-dependent facts, and multi-session callbacks) and measure recall accuracy and latency on each candidate. That is the work we do when we scope a memory layer at Particula Tech, because the published numbers tell you the shape of the difference but not its magnitude on your data.
