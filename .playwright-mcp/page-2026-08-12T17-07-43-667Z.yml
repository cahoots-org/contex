          - generic [ref=e83]:
            - generic [ref=e84]: TL;DR
            - paragraph [ref=e85]: "Agent memory frameworks are not interchangeable. Mem0 (~47K GitHub stars) is a hybrid vector+graph+key-value store with automatic extraction and a free tier, best for personalization. Zep wraps Graphiti, a temporal knowledge graph that tracks fact-validity windows, and it posts 63.8% on LongMemEval (GPT-4o) against Mem0's 49.0%, a 15-point gap on temporal retrieval. Letta carries the MemGPT lineage: an OS-style runtime where main context is RAM and archival memory is disk, and the agent self-manages allocation through memory tools and a REST API. Cognee runs an Extract-Cognify-Load pipeline into a typed knowledge graph but lacks SOC 2 and HIPAA certs. Pick on persistence model, temporal accuracy, latency, and compliance, not on stars."
          - generic [ref=e86]:
            - paragraph [ref=e87]: "An agent that nails 100% of your evals on Monday and forgets the user's name by Wednesday does not have a model problem. It has a memory problem, and across the agent systems we've shipped and audited, this is the defining Day-2 failure: the demo works because the whole conversation fits in one context window, and production breaks because real users come back across sessions, days, and topics. The best AI agent memory framework for 2026 is the one that survives that gap, and the four serious open-source candidates (Mem0, Zep, Letta, and Cognee) solve it in four genuinely different ways."
            - paragraph [ref=e88]: The differences are not cosmetic. On LongMemEval, the temporal-retrieval benchmark that has become the de facto stress test for this category, Zep's Graphiti backend scores 63.8% with GPT-4o while Mem0 lands at 49.0%. That is a 15-point gap on the exact capability (remembering facts that change over time) that most production agents need and most demos never test. Pick the wrong framework and you do not find out until a user contradicts something the agent stored three sessions ago and the agent confidently repeats the stale version.
            - paragraph [ref=e89]:
              - text: This post is the decision framework we use to scope agent memory. We will walk through what each of the four frameworks actually is (proxy-simple Mem0, temporal-graph Zep, OS-runtime Letta, typed-graph Cognee), where the benchmark gaps come from, and a decision matrix across persistence model, multi-agent coordination, self-host versus managed, latency, and SOC 2 / HIPAA readiness. If you want the architectural foundations underneath all of this, our guide on
              - link "how to make AI agents remember context across conversations" [ref=e90] [cursor=pointer]:
                - /url: /blog/ai-agent-memory-context-management
              - text: covers the patterns these frameworks implement; this post is about which framework to actually pick.
          - generic [ref=e92]:
            - heading "Why Memory Is the Defining Day-2 Agent Problem" [level=2] [ref=e93]
            - generic [ref=e94]:
              - paragraph [ref=e95]: "A stateless agent is a fancy autocomplete with tools. The moment you want an agent that recognizes a returning user, recalls a decision from last week, or notices that a fact it stored is now wrong, you need a memory layer that lives outside the context window. The context window is working memory: fast, bounded, and wiped at the end of the turn. Everything that has to persist needs somewhere durable to go, and the act of deciding what to store, how to retrieve it, and when to invalidate it is the entire problem."
              - paragraph [ref=e96]: "There are three sub-problems hiding inside \"memory,\" and frameworks differ on which they solve well:"
              - listitem [ref=e97]:
                - strong [ref=e98]: Extraction.
                - text: What gets remembered? A raw transcript is not memory; it is a log. Useful memory is distilled facts ("user prefers metric units," "account upgraded to Enterprise on 2026-03-14"). Mem0 leans hard into automatic extraction; Letta hands the decision to the agent itself.
              - listitem [ref=e99]:
                - strong [ref=e100]: Retrieval.
                - text: Given a new turn, which stored memories are relevant? Vector similarity is the cheap default, but it conflates "semantically close" with "actually useful," the same failure mode we cover in
                - link "agent-controlled retrieval" [ref=e101] [cursor=pointer]:
                  - /url: /blog/agentic-rag-agent-controlled-retrieval
                - text: . Graph traversal answers structured questions that embeddings miss.
              - listitem [ref=e102]:
                - strong [ref=e103]: Invalidation.
                - text: When a fact changes, does the old one go away cleanly? This is where flat vector stores quietly rot. They retrieve the closest embedding, and a stale fact often embeds just as close as the current one.
              - paragraph [ref=e104]:
                - text: "That third sub-problem, invalidation over time, is the one almost nobody designs for and the one that separates these four frameworks most sharply. It is also the reason a single benchmark number (LongMemEval) carries so much signal: it is built specifically to test whether an agent retrieves the"
                - emphasis [ref=e105]: currently true
                - text: fact rather than any plausible-looking one.
          - generic [ref=e107]:
            - 'heading "Mem0: Hybrid Store, Automatic Extraction, Fast Time-to-Value" [level=2] [ref=e108]'
            - generic [ref=e109]:
              - paragraph [ref=e110]:
                - text: Mem0 (~47K GitHub stars as of mid-2026) is the most popular agent memory framework, and the popularity is earned by how little it asks of you. You call
                - code [ref=e111]: add()
                - text: after a turn and
                - code [ref=e112]: search()
                - text: "before the next one, and Mem0 handles extraction and retrieval internally. Under the hood it runs a hybrid of three stores: a vector index for semantic recall, a graph layer for relationships between entities, and a key-value store for fast structured lookups. Automatic extraction means you do not write the \"what should I remember from this turn\" logic; an LLM call distills the salient facts for you."
              - paragraph [ref=e113]: The sweet spot is personalization. If your agent needs to remember that a user prefers concise answers, lives in Berlin, and is working on a TypeScript project, Mem0 stores and recalls those stable preferences cleanly with minimal integration effort. The free tier is generous enough to validate a prototype, and the managed cloud handles the infrastructure so you are not standing up a vector store and a graph database yourself.
              - paragraph [ref=e114]:
                - text: "Where Mem0 runs out of road is temporal reasoning. Its graph layer captures relationships, but it is not a first-class temporal model: facts are updated rather than versioned with explicit validity windows. When a user's plan changes, when a preference reverses, when a fact has a \"true from X to Y\" shape, Mem0 can store the new value but it does not natively reason about"
                - emphasis [ref=e115]: when
                - text: each value was true. That limitation shows up directly in the LongMemEval gap. For agents whose memory is mostly stable facts, this never bites. For agents tracking changing state, it bites hard.
              - paragraph [ref=e116]:
                - strong [ref=e117]: "Pick Mem0 when:"
                - text: you want personalization with a five-minute integration, your facts are mostly stable, and you would rather buy automatic extraction than build it.
          - generic [ref=e119]:
            - 'heading "Zep: Graphiti and the Temporal Knowledge Graph" [level=2] [ref=e120]'
            - generic [ref=e121]:
              - paragraph [ref=e122]: Zep is built on Graphiti, a temporal knowledge graph, and that single architectural choice is the whole story. Instead of storing a fact and overwriting it when it changes, Graphiti stores facts as edges with explicit validity windows. "User is on the Pro plan" does not get deleted when they upgrade; it gets marked invalid after the upgrade timestamp, and a new edge "user is on Enterprise" is created with its own valid-from date. The graph keeps the full history of what was true when.
              - paragraph [ref=e123]:
                - text: This is exactly the capability LongMemEval stresses, and it is why Zep posts 63.8% with GPT-4o against Mem0's 49.0%. The benchmark deliberately includes questions where a naive system retrieves a fact that
                - emphasis [ref=e124]: was
                - text: true but no longer is. A temporal graph answers "what is true now" and "what was true in March" without confusion because validity is a first-class attribute of every edge, not an afterthought. A flat vector store cannot, because it has no representation of time beyond a timestamp it does not reason over during retrieval.
              - paragraph [ref=e125]:
                - text: The cost is complexity and latency. A temporal graph traversal is more expensive than a vector nearest-neighbor lookup, and deep multi-hop queries can land in the low hundreds of milliseconds rather than the tens of milliseconds a vector lookup costs. For most agent workloads that overhead is acceptable next to model latency, but it is real, and you should benchmark it on your own graph density rather than trusting a vendor number. Graph-backed memory shares its conceptual roots with broader graph retrieval; if you are weighing whether to invest in graph infrastructure at all, our writeup on
                - link "GraphRAG implementation at scale" [ref=e126] [cursor=pointer]:
                  - /url: /blog/graphrag-implementation-enterprise-data-platform
                - text: covers the operational realities of running a knowledge graph in production.
              - paragraph [ref=e127]:
                - strong [ref=e128]: "Pick Zep when:"
                - text: your agent tracks state that changes over time (subscriptions, account status, evolving preferences, anything with a "as of" qualifier) and you need point-in-time correctness, not just recall.
          - generic [ref=e129]:
            - generic [ref=e130]:
              - 'heading "Letta: The MemGPT Runtime Where the Agent Manages Its Own Memory" [level=2] [ref=e131]'
              - generic [ref=e132]:
                - paragraph [ref=e133]: "Letta is the production framework from the MemGPT team, and it implements that paper's central metaphor literally. MemGPT framed an LLM as an operating system: the bounded context window is RAM, an external store is disk, and the agent uses tools to page information between them. Letta turns that into a stateful runtime. Main context holds the active working set. Archival memory holds the overflow. And critically, the agent itself decides what to promote into context and what to evict, by calling memory-edit tools, rather than a framework making that call for it."
                - paragraph [ref=e134]:
                  - text: This is a fundamentally different posture from Mem0 or Zep. Those are memory
                  - emphasis [ref=e135]: services
                  - text: "you call from your application: store this, fetch that. Letta is a memory-managing"
                  - emphasis [ref=e136]: agent runtime
                  - text: you deploy as a server with a REST API. The agent is long-lived and stateful by design; it owns its own memory budget the way a process owns its address space. That makes Letta a strong fit for long-running stateful services (a persistent assistant, a multi-session support agent, anything that lives for days and accumulates a working context it has to curate).
                - paragraph [ref=e137]:
                  - text: The tradeoff is that you are buying into a runtime model, not a library. You run Letta as a service, you interact through its API, and you give the agent the autonomy to manage its own memory, which means you are trusting the agent's self-editing decisions. When that autonomy is the point (the agent genuinely needs to reason about its own working set), Letta is uniquely suited. When you just want to stash and retrieve facts from an app you already have, it is more machinery than the job requires. The self-management pattern connects directly to the broader shift we describe in
                  - link "context engineering replacing prompt engineering" [ref=e138] [cursor=pointer]:
                    - /url: /blog/context-engineering-post-prompt-era
                  - text: ": the hard problem is no longer the prompt, it is curating what occupies the context window over time."
                - paragraph [ref=e139]:
                  - strong [ref=e140]: "Pick Letta when:"
                  - text: you are building a long-running stateful agent that should own its memory allocation, and a REST-addressable runtime fits your architecture better than a memory call inside an existing app.
            - complementary [ref=e141]:
