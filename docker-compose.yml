services:
  postgres:
    image: paradedb/paradedb:0.25.9-pg18
    ports:
      - "${CONTEX_PG_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=contex
      - POSTGRES_USER=contex
      - POSTGRES_PASSWORD=contex_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contex -d contex"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${CONTEX_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  contex:
    build:
      context: .
      platforms:
        - linux/amd64
    ports:
      - "${CONTEX_HTTP_PORT:-8001}:8001"
    # Load .env if present (copy .env.example → .env to set AUTH_ENABLED, secrets,
    # etc.). Optional so a fresh clone still starts. The environment: values below
    # take precedence where they overlap, keeping the dev stack self-contained.
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql+asyncpg://contex:contex_password@postgres:5432/contex
      - REDIS_URL=redis://redis:6379
      # Local dev runs open (no auth). The container must bind 0.0.0.0 for
      # Docker to publish the port, so opt out of protected mode here. Enable
      # AUTH_ENABLED=true for any network-reachable deployment (see README).
      - CONTEX_PROTECTED_MODE=false
      - SIMILARITY_THRESHOLD=0.5
      - MAX_MATCHES=10
      - MAX_CONTEXT_SIZE=51200
      # Hybrid search runs entirely on Postgres (pgvector + native FTS, fused with RRF).
      - HYBRID_SEARCH_ENABLED=true
      - RRF_K=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || curl -f -g http://[::1]:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '2.0'
        reservations:
          memory: 1GB
          cpus: '1.0'

volumes:
  postgres-data:
    driver: local
