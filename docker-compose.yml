services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: contex-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=contex
      - POSTGRES_USER=contex
      - POSTGRES_PASSWORD=contex_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contex -d contex"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: contex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  contex:
    build:
      context: .
      platforms:
        - linux/amd64
    container_name: contex-app
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://contex:contex_password@postgres:5432/contex
      - REDIS_URL=redis://redis:6379
      - SIMILARITY_THRESHOLD=0.5
      - MAX_MATCHES=10
      - MAX_CONTEXT_SIZE=51200
      # Hybrid search runs entirely on Postgres (pgvector + native FTS, fused with RRF).
      - HYBRID_SEARCH_ENABLED=true
      - RRF_K=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || curl -f -g http://[::1]:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2GB
          cpus: '2.0'
        reservations:
          memory: 1GB
          cpus: '1.0'

volumes:
  postgres-data:
    driver: local
