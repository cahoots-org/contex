name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:0.25.9-pg18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: contex_test
          POSTGRES_USER: contex
          POSTGRES_PASSWORD: contex_password
        options: >-
          --health-cmd "pg_isready -U contex -d contex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Cache Python dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Lint
      run: ruff check .

    - name: Install Tesseract for the OCR tests
      run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

    - name: Wait for services
      run: |
        echo "Waiting for PostgreSQL..."
        until pg_isready -h localhost -p 5432 -U contex; do
          echo "PostgreSQL not ready, waiting..."
          sleep 2
        done
        echo "PostgreSQL is ready!"

    - name: Run pytest
      env:
        TEST_DATABASE_URL: postgresql+asyncpg://contex:contex_password@localhost:5432/contex_test
      run: |
        pytest tests/ -v --tb=short

  connectors:
    name: Connector Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: contex_test
          POSTGRES_USER: contex
          POSTGRES_PASSWORD: contex_password
        options: >-
          --health-cmd "pg_isready -U contex -d contex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'

    - name: Cache Python dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-connectors-${{ hashFiles('connectors/**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-connectors-

    - name: Install connector dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest==9.1.1 pytest-asyncio==1.4.0
        pip install -r connectors/base/requirements.txt
        pip install -r connectors/postgres/requirements.txt
        pip install -r connectors/s3/requirements-dev.txt
        pip install -r connectors/github/requirements-dev.txt
        pip install -r connectors/atlassian/requirements-dev.txt
        pip install -r connectors/kafka/requirements.txt

    - name: Start Redpanda
      run: |
        docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v24.3.6 \
          redpanda start --mode dev-container --kafka-addr 0.0.0.0:9092 \
          --advertise-kafka-addr localhost:9092
        for i in $(seq 1 30); do
          docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true' && exit 0
          sleep 2
        done
        docker logs redpanda
        exit 1

    - name: Run connector tests
      env:
        POSTGRES_TEST_DSN: postgresql://contex:contex_password@localhost:5432/contex_test
        KAFKA_TEST_BOOTSTRAP: localhost:9092
      run: |
        pytest connectors/base connectors/postgres connectors/s3 connectors/github connectors/atlassian connectors/kafka -v --tb=short

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: paradedb/paradedb:0.25.9-pg18
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: contex
          POSTGRES_USER: contex
          POSTGRES_PASSWORD: contex_password
        options: >-
          --health-cmd "pg_isready -U contex -d contex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        docker system prune -af

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Build Docker image
      uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
      with:
        context: .
        push: false
        load: true
        tags: contex:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Boot the image
      run: |
        docker run -d --name contex --network host \
          -e DATABASE_URL=postgresql+asyncpg://contex:contex_password@localhost:5432/contex \
          -e CONTEX_PROTECTED_MODE=false \
          contex:test
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8001/health; then exit 0; fi
          sleep 2
        done
        docker logs contex
        exit 1

